name: pm_app
description: Offline Flutter study app for the mercancías question bank.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  pm_questions_bank:
    path: ../packages/pm_questions_bank
  pm_questions:
    path: ../packages/pm_questions
  pm_persistence:
    path: ../packages/pm_persistence
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  meta: ^1.19.0
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_sticky_header: ^0.8.0
  intl: ^0.20.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
